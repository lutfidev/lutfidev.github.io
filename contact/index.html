<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Muhammad Lutfi</title>
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <script defer src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js"></script>

    <style>
        .contact-container { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

        .contact-page-header { margin-bottom: 2.5rem; }
        .contact-page-header h1 { font-size: 2.25rem; margin-bottom: 0.4rem; }
        .contact-page-header p { color: var(--text-muted); font-size: 0.9rem; }

        .contact-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .contact-info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem 1.4rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .contact-info-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .contact-info-icon i { width: 18px; height: 18px; color: var(--accent); }

        .contact-info-text { display: flex; flex-direction: column; gap: 2px; }
        .contact-info-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .contact-info-value { font-size: 0.9rem; color: var(--text-main); font-weight: 500; }
        .contact-info-value a { color: var(--accent); text-decoration: none; }
        .contact-info-value a:hover { text-decoration: underline; }

        .connect-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }

        .connect-section h2 {
            font-size: 1.25rem; margin-bottom: 0.5rem;
        }
        .connect-section > p {
            color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;
        }

        .connect-links {
            display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;
        }

        .connect-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500;
            padding: 10px 18px; border-radius: 10px;
            border: 1px solid var(--border); background: transparent;
            transition: all 0.2s;
        }
        .connect-btn:hover {
            color: var(--text-main); border-color: var(--text-muted); background: rgba(255,255,255,0.04);
        }
        .connect-btn i { width: 17px; height: 17px; }

        body.light-mode .connect-btn:hover { background: rgba(0,0,0,0.04); }

        @media (max-width: 640px) {
            .contact-info-grid { grid-template-columns: 1fr; }
            .connect-section { padding: 1.5rem 1.25rem; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>
    <div class="grid-background"></div>

    <div class="contact-container">

        <div class="contact-page-header animate-ready">
            <h1>Contact</h1>
            <p>Have an interesting project or want to collaborate? Don't hesitate to reach out.</p>
        </div>

        <div class="contact-info-grid animate-ready">
            <div class="contact-info-card">
                <div class="contact-info-icon"><i data-lucide="mail"></i></div>
                <div class="contact-info-text">
                    <span class="contact-info-label">Email</span>
                    <span class="contact-info-value"><a href="mailto:yoluvy.dev@gmail.com">yoluvy.dev@gmail.com</a></span>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="contact-info-icon"><i data-lucide="map-pin"></i></div>
                <div class="contact-info-text">
                    <span class="contact-info-label">Location</span>
                    <span class="contact-info-value">Batam City, Indonesia</span>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="contact-info-icon"><i data-lucide="clock"></i></div>
                <div class="contact-info-text">
                    <span class="contact-info-label">Timezone</span>
                    <span class="contact-info-value">UTC+7 (WIB)</span>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="contact-info-icon"><i data-lucide="briefcase"></i></div>
                <div class="contact-info-text">
                    <span class="contact-info-label">Available For</span>
                    <span class="contact-info-value">Work & Project</span>
                </div>
            </div>
        </div>

        <div class="connect-section animate-ready">
            <h2>Connect with me</h2>
            <p>Find me on the following platforms.</p>
            <div class="connect-links">
                <a href="https://github.com/lutfidev" target="_blank" class="connect-btn">
                    <i data-lucide="github"></i> GitHub
                </a>
                <a href="https://linkedin.com/in/lutfidev/" target="_blank" class="connect-btn">
                    <i data-lucide="linkedin"></i> LinkedIn
                </a>
                <a href="https://wa.me/6281234567890" target="_blank" class="connect-btn">
                    <i data-lucide="message-circle"></i> WhatsApp
                </a>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script>initComponents('../');</script>
    <script src="../js/animations.js"></script>
</body>
</html>
